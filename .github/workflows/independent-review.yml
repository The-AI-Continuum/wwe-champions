name: Independent Review

# External PR review waits for successful required checks on the current PR revision.
# It publishes immutable review evidence; the separate binding-approval workflow
# validates that evidence and submits the independent GitHub APPROVE review.
# Legacy phase identifiers are retained solely for evidence-contract compatibility.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_url:
        description: Pull request URL to review (dispatch with the PR's branch as ref, or the verdict cannot find the PR)
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: write

# A new push makes the running review stale; cancel it to free the runner.
concurrency:
  group: independent-review-${{ github.event.pull_request.html_url || inputs.pr_url }}
  cancel-in-progress: true

jobs:
  pr-agent:
    # Keep this check name stable; EXTERNAL_PR_MODEL records the effective model.
    name: PR-Agent (external)
    # Drafts skip review; ready_for_review starts it. Saves a runner per draft push.
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Keep the review model pinned for reproducible review evidence.
      EXTERNAL_PR_MODEL: openrouter/z-ai/glm-5.3-flash
      PR_URL: ${{ inputs.pr_url || github.event.pull_request.html_url }}
    steps:
      - name: Validate mandatory PR-Agent credential
        id: review-key
        env:
          PRA_KEY: ${{ secrets.OPENROUTER_PR_APPROVER_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${PRA_KEY//[[:space:]]/}" ]]; then
            echo '::error::OPENROUTER_PR_APPROVER_KEY is required for external PR review.'
            exit 1
          fi

      # PR-Agent reviews through GitHub's API. Checkout stays on the trusted default
      # branch, so this workflow never checks out or executes pull-request code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Snapshot required-check evidence
        id: phase1
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_URL: ${{ env.PR_URL }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          # Commit exact prerequisite check names for this repository; never include this
          # review or its approval job (that would create a dependency cycle).
          REQUIRED_REVIEW_CHECK_NAMES: '["Build & test", "Secrets scan", "SAST", "Dependency audit", "work-item-link", "Code review (OCR)"]'
        with:
          script: |
            const fs = require('fs');
            let requiredCheckNames;
            try {
              requiredCheckNames = JSON.parse(process.env.REQUIRED_REVIEW_CHECK_NAMES || '');
            } catch {
              throw new Error('REQUIRED_REVIEW_CHECK_NAMES must be a nonempty JSON array of exact check names.');
            }
            if (!Array.isArray(requiredCheckNames) || requiredCheckNames.length === 0 ||
                requiredCheckNames.some(name => typeof name !== 'string' || name.length === 0 || name !== name.trim()) ||
                new Set(requiredCheckNames).size !== requiredCheckNames.length) {
              throw new Error('REQUIRED_REVIEW_CHECK_NAMES must contain distinct, nonempty, trimmed check names.');
            }
            const waitUntil = Date.now() + 25 * 60 * 1000;
            const match = process.env.PR_URL.match(/\/pull\/(\d+)\/?$/);
            if (!match) {
              throw new Error(`Invalid pull-request URL: ${process.env.PR_URL}`);
            }

            const pull_number = Number(match[1]);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            });
            let phase1Checks = [];
            let missing = [];
            let incomplete = [];
            const allowedConclusions = new Set(['success']);
            while (true) {
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              phase1Checks = requiredCheckNames.map((name) => checkRuns
                .filter((check) => check.name === name)
                .sort((a, b) => Number(b.id) - Number(a.id))[0])
                .filter(Boolean);
              missing = requiredCheckNames.filter((name) => !phase1Checks.some((check) => check.name === name));
              incomplete = phase1Checks.filter((check) =>
                check.status !== 'completed' || !allowedConclusions.has(check.conclusion)
              );
              if (missing.length === 0 && incomplete.length === 0) break;
              const draftDeferredChecks = new Set(['Code review (OCR)']);
              const readyForReview = context.payload.action === 'ready_for_review';
              const terminalFailure = incomplete.some((check) => check.status === 'completed' &&
                !(readyForReview && check.conclusion === 'skipped' && draftDeferredChecks.has(check.name))
              );
              if (terminalFailure) break;
              if (Date.now() >= waitUntil) break;
              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }
            const passed = missing.length === 0 && incomplete.length === 0;
            const body = pr.body || '';
            const linkMatch = body.match(/(?:[Ff]ixes|[Cc]loses|[Rr]esolves)\s+#(\d+)/);
            let workItemNodeId = null;
            if (linkMatch) {
              const issueNumber = Number(linkMatch[1]);
              try {
                const query = `
                  query($owner: String!, $repo: String!, $issue: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $issue) {
                        id
                      }
                    }
                  }
                `;
                const variables = {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue: issueNumber
                };
                const result = await github.graphql(query, variables);
                workItemNodeId = result.repository.issue.id;
              } catch (e) {
                console.error("Could not fetch issue node id", e);
              }
            }

            const evidence = {
              schemaVersion: 1,
              phase: 'phase1',
              collectedAt: new Date().toISOString(),
              pr: { number: pull_number, url: pr.html_url, headSha: pr.head.sha, workItemNodeId },
              checks: phase1Checks.map((check) => ({
                name: check.name,
                status: check.status,
                conclusion: check.conclusion,
                detailsUrl: check.details_url,
              })),
              verdict: passed ? 'pass' : 'block',
              blockReasons: passed ? [] : [
                ...missing.map((name) => `${name}: check evidence is missing.`),
                ...incomplete.map((check) => `${check.name}: ${check.status}/${check.conclusion}`),
              ].filter(Boolean),
            };
            fs.writeFileSync('phase1-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
            core.setOutput('pr_number', String(pull_number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('passed', String(passed));

      - name: Resolve latest OCR artifact
        id: ocr-source
        if: steps.phase1.outputs.passed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_HEAD: ${{ steps.phase1.outputs.head_sha }}
        with:
          script: |
            const fs = require('fs');
            const { resolveOcrArtifact } = require('./.github/scripts/validate-ocr-result.cjs');
            const source = await resolveOcrArtifact(github, context.repo, process.env.PR_HEAD);
            fs.rmSync('ocr-artifacts', { recursive: true, force: true });
            fs.rmSync('ocr-evidence.json', { force: true });
            fs.writeFileSync('ocr-source.json', JSON.stringify(source));
            core.setOutput('run_id', String(source.runId));
            core.setOutput('artifact_name', source.artifactName);

      - name: Download raw OCR evidence
        if: steps.phase1.outputs.passed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.ocr-source.outputs.artifact_name }}
          path: ocr-artifacts
          run-id: ${{ steps.ocr-source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require complete OCR evidence
        if: steps.phase1.outputs.passed == 'true'
        env:
          PR_HEAD: ${{ steps.phase1.outputs.head_sha }}
          PR_NUMBER: ${{ steps.phase1.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
          OCR_CHANGED_FILES: ${{ runner.temp }}/ocr-changed-files.txt
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[] | [.status, .filename] | @tsv' > "$RUNNER_TEMP/ocr-pr-files.tsv"
          # GitHub truncates the raw list (deletions included) at 3000 files.
          if [ "$(wc -l < "$RUNNER_TEMP/ocr-pr-files.tsv")" -ge 3000 ]; then
            echo '::error::The PR changes 3000+ files; GitHub truncates the list, so OCR coverage cannot be verified.'
            exit 1
          fi
          awk -F '\t' '$1 != "removed" { print $2 }' "$RUNNER_TEMP/ocr-pr-files.tsv" > "$OCR_CHANGED_FILES"
          node .github/scripts/validate-ocr-result.cjs ocr-artifacts/ocr-result.json "$PR_HEAD" ocr-source.json > ocr-evidence.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Reviewed PR-Agent runtime (price-first routing, one approved model, complete responses only),
      # installed from the trusted default-branch checkout above, never from pull-request code.
      # Fails closed while the default branch does not carry it yet: land the runtime first
      # (README, "Reviewed PR-Agent runtime").
      - name: Install reviewed PR-Agent runtime
        run: |
          set -euo pipefail
          runtime=.github/scripts/pr-agent-runtime
          if [[ ! -f "$runtime/install.sh" ]]; then
            echo "::error::The trusted default branch has no $runtime; land the reviewed runtime before this workflow."
            exit 1
          fi
          bash "$runtime/install.sh" "$RUNNER_TEMP/pr-agent-venv"
          echo "PR_AGENT_PYTHON=$RUNNER_TEMP/pr-agent-venv/bin/python" >> "$GITHUB_ENV"

      # Match the trusted default branch policy used by the workflow_run verdict,
      # including while a pull request changes the future model pin.
      - name: Resolve trusted review model
        id: trusted-model
        run: |
          "$PR_AGENT_PYTHON" - <<'PY'
          import os
          import re
          from pathlib import Path

          import yaml

          class UniqueKeyLoader(yaml.SafeLoader):
              def construct_mapping(self, node, deep=False):
                  self.flatten_mapping(node)
                  keys = set()
                  for key_node, _ in node.value:
                      key = self.construct_object(key_node, deep=True)
                      if key in keys:
                          raise ValueError("Duplicate YAML mapping key")
                      keys.add(key)
                  return super().construct_mapping(node, deep=deep)

          source = Path(".github/workflows/independent-review.yml").read_text(encoding="utf-8")
          workflow = yaml.load(source, Loader=UniqueKeyLoader)
          model = workflow["jobs"]["pr-agent"]["env"]["EXTERNAL_PR_MODEL"]
          node = yaml.compose(source, Loader=UniqueKeyLoader)
          for key in ("jobs", "pr-agent", "env", "EXTERNAL_PR_MODEL"):
              if not isinstance(node, yaml.MappingNode):
                  raise ValueError("Trusted model path must contain mappings")
              matches = [(k, v) for k, v in node.value
                         if isinstance(k, yaml.ScalarNode) and k.tag == "tag:yaml.org,2002:str" and k.value == key]
              if len(matches) != 1:
                  raise ValueError("Trusted model path must be explicit and unique")
              key_node, node = matches[0]
          if (not isinstance(node, yaml.ScalarNode) or node.tag != "tag:yaml.org,2002:str"
                  or node.style not in (None, "'", '"')
                  or node.start_mark.line != node.end_mark.line
                  or key_node.end_mark.line != node.start_mark.line
                  or not re.fullmatch(r":\s*", source[key_node.end_mark.index:node.start_mark.index])):
              raise ValueError("Trusted model must be a single-line string literal")
          raw = source[node.start_mark.index:node.end_mark.index]
          if ((node.style is None and raw != model)
                  or (node.style is not None and (not raw.startswith(node.style) or not raw.endswith(node.style)))
                  or not isinstance(model, str)
                  or not re.fullmatch(r"openrouter/[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*(?::[A-Za-z0-9][A-Za-z0-9._-]*)?", model)):
              raise ValueError("Trusted model is invalid")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"model={model}\n")
          PY

      # PR-Agent drops bad extensions, lockfiles and minified bundles. A pull
      # request touching only those gets an empty diff and no review comment;
      # this decides, from the trusted default branch, whether that is expected.
      - name: Snapshot reviewable file coverage
        id: coverage
        if: steps.phase1.outputs.passed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const phase1 = JSON.parse(fs.readFileSync('phase1-evidence.json', 'utf8'));
            // The classifier ships in the same change that first uses it, so the
            // trusted default branch may not have it yet. Without it the gate keeps
            // its previous strict behaviour: a missing review comment blocks.
            let classifyPrFiles = null;
            try {
              ({ classifyPrFiles } = require('./.github/scripts/pr-agent-coverage.cjs'));
            } catch (error) {
              if (error.code !== 'MODULE_NOT_FOUND') throw error;
              core.warning('Review coverage classifier is not on the default branch yet; empty coverage will stay blocking.');
            }
            fs.rmSync('pr-agent-coverage.json', { force: true });
            if (classifyPrFiles) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: phase1.pr.number,
                per_page: 100,
              });
              // GitHub truncates the raw list at 3000 files, so coverage beyond that cannot be proven.
              if (files.length >= 3000) {
                throw new Error('The PR changes 3000+ files; GitHub truncates the list, so review coverage cannot be verified.');
              }
              const coverage = classifyPrFiles(files);
              fs.writeFileSync('pr-agent-coverage.json', `${JSON.stringify(coverage, null, 2)}\n`);
              core.setOutput('reviewable_count', String(coverage.reviewable.length));
            }

      - name: Record review start
        id: review-start
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        if: steps.phase1.outputs.passed == 'true'
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_PR_APPROVER_KEY }}
          OPENROUTER__API_BASE: https://openrouter.ai/api/v1
          CONFIG__MODEL: ${{ steps.trusted-model.outputs.model }}
          # Dynaconf scalar reset: in pr-agent 0.45 an env list ('[]') merges with the
          # shipped fallback list, so reset it to empty here and again on the CLI below.
          CONFIG__FALLBACK_MODELS: ''
          OPENROUTER__REASONING_EFFORT: low
          CONFIG__MAX_OUTPUT_TOKENS: '8192'
          # PR-Agent hard-fails on any model absent from its built-in MAX_TOKENS
          # table, and this OpenRouter slug is not in it. Without this the job
          # posts nothing — the exact silent-green this gate exists to prevent.
          # Keep the configured 260000-token ceiling; do not inherit another model's context limit.
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: '260000'
          PR_REVIEWER__PERSISTENT_COMMENT: 'false'
          CONFIG__GIT_PROVIDER: github
          GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB__DEPLOYMENT_TYPE: user
          CONFIG__PUBLISH_OUTPUT: 'true'
        # The log is evidence: an empty diff is the only reason PR-Agent may
        # publish nothing without blocking the gate.
        run: |
          set -o pipefail
          "$PR_AGENT_PYTHON" -m pr_agent.cli --pr_url "$PR_URL" review '--config.fallback_models=[]' 2>&1 | tee pr-agent-review.log

      - name: Build external-review evidence
        id: phase2
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          REVIEW_STARTED_AT: ${{ steps.review-start.outputs.timestamp }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          REQUESTED_MODEL: ${{ steps.trusted-model.outputs.model }}
          SOURCE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          SOURCE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const phase1 = JSON.parse(fs.readFileSync('phase1-evidence.json', 'utf8'));
            let coverage = null;
            try {
              coverage = JSON.parse(fs.readFileSync('pr-agent-coverage.json', 'utf8'));
            } catch {
              coverage = null;
            }
            const evidence = {
              schemaVersion: 1,
              phase: 'phase2',
              sourceWorkflowRun: Number(process.env.SOURCE_WORKFLOW_RUN_ID),
              sourceRunAttempt: Number(process.env.SOURCE_WORKFLOW_RUN_ATTEMPT),
              collectedAt: new Date().toISOString(),
              pr: phase1.pr,
              phase1,
              externalReview: {
                reviewer: 'PR-Agent',
                requestedModel: process.env.REQUESTED_MODEL,
                credentialChannel: 'pr-approver',
                status: 'unavailable',
                verdict: 'block',
              },
              verdict: 'block',
              blockReasons: [],
            };

            if (phase1.verdict !== 'pass') {
              evidence.blockReasons.push('Required-check evidence did not pass.');
            } else if (process.env.REVIEW_OUTCOME !== 'success') {
              evidence.blockReasons.push(`PR-Agent job outcome: ${process.env.REVIEW_OUTCOME || 'not-run'}.`);
            } else {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: phase1.pr.number,
                per_page: 100,
              });
              const startedAt = Date.parse(process.env.REVIEW_STARTED_AT);
              const reviewComment = comments
                .filter((comment) =>
                  comment.user?.login === 'github-actions[bot]' &&
                  Date.parse(comment.created_at) >= startedAt &&
                  /PR Reviewer Guide/i.test(comment.body || '')
                )
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];

              if (!reviewComment) {
                // PR-Agent publishes nothing when it loads an empty diff, which is
                // what happens when every changed file is filtered out. Accept that
                // only when the reviewer's own log confirms the empty diff and the
                // trusted classifier independently agrees there is nothing to review.
                let emptyDiffObserved = false;
                try {
                  emptyDiffObserved = fs.readFileSync('pr-agent-review.log', 'utf8')
                    .split('\n')
                    .some((line) => line.includes('Empty diff for PR:') && line.includes(phase1.pr.url));
                } catch {
                  emptyDiffObserved = false;
                }
                if (coverage && coverage.reviewable?.length === 0 && coverage.changed?.length > 0 && emptyDiffObserved) {
                  evidence.externalReview = {
                    reviewer: 'PR-Agent',
                    requestedModel: process.env.REQUESTED_MODEL,
                    credentialChannel: 'pr-approver',
                    status: 'skipped',
                    reason: 'no-reviewable-files',
                    coverage,
                    verdict: 'pass',
                  };
                } else {
                  evidence.blockReasons.push('PR-Agent completed without a published review comment.');
                }
              } else {
                const body = reviewComment.body || '';
                evidence.externalReview = {
                  reviewer: 'PR-Agent',
                  requestedModel: process.env.REQUESTED_MODEL,
                  credentialChannel: 'pr-approver',
                  status: 'completed',
                  commentId: reviewComment.id,
                  commentUrl: reviewComment.html_url,
                  commentCreatedAt: reviewComment.created_at,
                  contentSha256: crypto.createHash('sha256').update(body).digest('hex'),
                  coverage,
                  verdict: 'pass',
                };
              }
            }

            try {
              evidence.ocrReview = JSON.parse(fs.readFileSync('ocr-evidence.json', 'utf8'));
              if (evidence.ocrReview.status !== 'complete' || evidence.ocrReview.headSha !== evidence.pr.headSha) {
                throw new Error('Incomplete OCR evidence');
              }
            } catch {
              evidence.blockReasons.push('Complete current-head OCR evidence is unavailable.');
            }

            if (evidence.phase1.verdict === 'pass' && evidence.externalReview.verdict === 'pass' && evidence.blockReasons.length === 0) {
              evidence.verdict = 'pass';
            }
            fs.writeFileSync('phase2-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
            core.setOutput('verdict', evidence.verdict);

      - name: Upload external-review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase2-evidence-${{ steps.phase1.outputs.pr_number }}-${{ steps.phase1.outputs.head_sha }}-${{ github.run_attempt }}
          path: phase2-evidence.json
          retention-days: 14

      - name: Fail closed when review evidence blocks
        if: always() && steps.phase2.outputs.verdict != 'pass'
        run: exit 1
