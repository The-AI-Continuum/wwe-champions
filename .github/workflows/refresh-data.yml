name: Refresh Champions Data

on:
  schedule:
    # Every Tuesday at 08:00 UTC — after Monday Night Raw and weekend PPVs
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-champions-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: refresh-data

    steps:
      - name: Validate GH-OMP credentials are configured
        env:
          APP_ID: ${{ secrets.OMP_GH_APP_ID }}
          PRIVATE_KEY_B64: ${{ secrets.OMP_GH_APP_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$APP_ID" || { echo "Missing OMP_GH_APP_ID in the refresh-data environment"; exit 1; }
          test -n "$PRIVATE_KEY_B64" || { echo "Missing OMP_GH_APP_PRIVATE_KEY_B64 in the refresh-data environment"; exit 1; }

      - name: Decode and mask GH-OMP App key
        id: app-key
        env:
          PRIVATE_KEY_B64: ${{ secrets.OMP_GH_APP_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          private_key="$(printf '%s' "$PRIVATE_KEY_B64" | base64 --decode | tr -d '\r' | awk 'BEGIN{ORS="\\n"}{print}')"
          printf '%s\n' "::add-mask::${private_key}"
          case "$private_key" in
            '-----BEGIN '*'PRIVATE KEY-----'*) ;;
            *) echo 'Decoded OMP_GH_APP_PRIVATE_KEY_B64 is not a PEM private key'; exit 1 ;;
          esac
          printf 'private_key=%s\n' "$private_key" >> "$GITHUB_OUTPUT"

      - name: Create repository-scoped GH-OMP token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.OMP_GH_APP_ID }}
          private-key: ${{ steps.app-key.outputs.private_key }}
          owner: ${{ github.repository_owner }}
          repositories: wwe-champions
          permission-contents: write
          permission-pull-requests: write

      - name: Verify token belongs to GH-OMP
        if: steps.app-token.outputs.app-slug != 'gh-omp'
        run: |
          echo "Refusing to create a refresh PR with unexpected App: ${{ steps.app-token.outputs.app-slug }}"
          exit 1

      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Skip if a refresh PR is already open
        id: pending
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          count="$(gh pr list --repo "$GH_REPO" --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("refresh-data/"))] | length')"
          if [ "$count" -gt 0 ]; then
            echo "An open refresh-data PR already exists; skipping this refresh."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.pending.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-scraper.txt

      - name: Install dependencies
        if: steps.pending.outputs.exists != 'true'
        run: pip install -r .github/requirements-scraper.txt

      - name: Install Playwright browsers
        if: steps.pending.outputs.exists != 'true'
        run: playwright install chromium --with-deps

      - name: Run scraper
        if: steps.pending.outputs.exists != 'true'
        run: python scrape.py

      - name: Create or update GH-OMP refresh PR
        if: steps.pending.outputs.exists != 'true'
        env:
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="refresh-data/$(date -u +%Y-%m-%d)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch --track -c "$branch" "origin/$branch"
          else
            git switch -c "$branch"
          fi
          git config user.name "gh-omp[bot]"
          app_user_id="$(gh api 'users/gh-omp%5Bbot%5D' --jq .id)"
          git config user.email "${app_user_id}+gh-omp[bot]@users.noreply.github.com"
          git add public/champions.json public/metadata.json index.html
          if git diff --cached --quiet; then
            echo "No data changes — no refresh PR needed."
            exit 0
          fi
          git commit -m "chore: refresh champions data"
          git push --set-upstream origin "$branch"
          cat > "$RUNNER_TEMP/refresh-pr-body.md" <<'EOF'
          Automated weekly champion data refresh. Please review and merge after required checks pass.

          Related: JOS-598
          EOF
          gh pr create \
            --repo "$GH_REPO" \
            --base "$DEFAULT_BRANCH" \
            --head "$branch" \
            --title "chore: weekly champions data refresh" \
            --body-file "$RUNNER_TEMP/refresh-pr-body.md"
