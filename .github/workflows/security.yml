name: Security

# Security companion for the required-check evidence snapshot.
# ci.yml already owns Secrets scan; this workflow restores the required SAST check
# declared in the committed required-check list without duplicating the rest of CI.
# SAST runs Semgrep code-analysis rules: p/default (cross-language security and correctness)
# plus the TypeScript/JavaScript, Python and GitHub Actions packs. Secrets scan (gitleaks) owns
# secret detection, so p/secrets is not listed here.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sast:
    name: SAST
    runs-on: ubuntu-latest # keeps the shared local runners free for reviews
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep:1.174.0@sha256:f1f7b71861c7b28b6e0f661225a2c4f58a484f5d0f182465c6d6b3b22f972ade \
            semgrep scan --config=p/default --config=p/typescript --config=p/python --config=p/github-actions --error --quiet
